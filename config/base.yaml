use_calib: False
single_thread: False
dataset:
  subsample: 1
  img_downsample: 1
  center_principle_point: True

matching:
  max_iter: 10
  lambda_init: 1e-8
  convergence_thresh: 1e-6
  dist_thresh: 1e-1 # distance in 3D space
  radius: 3
  dilation_max: 5 # Right now starts from max and iteratively decreases until 1

tracking:
  min_match_frac: 0.05
  max_iters: 50
  C_conf: 0.0
  Q_conf: 1.5
  rel_error: 1e-3
  delta_norm: 1e-3
  huber: 1.345
  match_frac_thresh: 0.333
  sigma_ray: 0.003
  sigma_dist: 1e+1
  sigma_pixel: 1.0
  sigma_depth: 1e+1 # NOTE: log-depth!
  sigma_point: 0.05
  pixel_border: -10 # Only in calib (negative means allow pixels outside image up to that distance)
  depth_eps: 1e-6 # Only in calib case
  filtering_mode: weighted_pointmap # recent, first, best_score, weighted_pointmap, weighted_spherical, indep_conf
  filtering_score: median # median, mean (only used for filtering_mode=best_score)
  sigma_frame_diag: [0.02, 0.02, 0.08] # uncertainty of sigma_x, sigma_y, sigma_z
  cov_eps: 1.0e-6 # epsilon added to residual variance for numerical stability
  var_floor: 1.0e-4 # minimum residual variance to avoid infinite weights
  min_valid_residuals: 10 # fallback to constant weights if valid residuals below this
  weight_clamp: true # enable to clamp sqrt-info weights (improves robustness)
  weight_clamp_min: 1.0e-2 # lower bound for sqrt-info when clamping is enabled
  weight_clamp_max: 1.0e1 # upper bound for sqrt-info when clamping is enabled
  covariance_regularization: 1.0e-6 # diagonal jitter added before inverting covariances
  use_confidence_weighting: false # scale information matrices using average confidence
  enable_covariance_check: true # run eigenvalue/condition monitoring after each fusion

local_opt:
  pin: 1
  window_size: 1e+6   
  C_conf: 0.0
  Q_conf: 1.5
  min_match_frac: 0.1
  pixel_border: -10 # Only in calib (negative means allow pixels outside image up to that distance)
  depth_eps: 1e-6 # Only in calib case
  max_iters: 10
  sigma_ray: 0.003
  sigma_dist: 1e+1
  sigma_pixel: 1.0
  sigma_depth: 1e+1 # NOTE: log-depth!
  sigma_point: 0.05
  delta_norm: 1e-8
  use_cuda: True

retrieval:
  k: 3
  min_thresh: 5e-3

reloc:
  min_match_frac: 0.3
  strict: True